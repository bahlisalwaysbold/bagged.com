<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout — Bagged</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="Bagged"></a><div class="header-actions"><a class="icon-btn" href="cart.html">🛍</a></div></header><main class="container checkout-page"><div class="page-hero"><span class="eyebrow">CHECKOUT</span><h1>Let's bag it.</h1><p>Place your order now. The store owner will confirm delivery details with you.</p></div><div class="checkout-grid"><form id="checkout-form" class="form-card"><h2>Delivery details</h2><label>Full name<input required name="name" autocomplete="name" placeholder="Emmanuel Okoro"></label><label>Phone<input required name="phone" autocomplete="tel" placeholder="0801 234 5678"></label><label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com"></label><label>Delivery address<textarea required name="address" autocomplete="street-address" rows="4" placeholder="House number, street, area"></textarea></label><label>Payment method<select name="payment"><option>Pay on delivery</option></select></label><p id="checkout-message" class="catalog-message" role="status" aria-live="polite"></p><button class="btn btn-primary" type="submit">Bag it now →</button></form><aside id="checkout-summary" class="summary-card"></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/checkout.js"></script></body></html>
